    owner: farfarfun
    action: 已修一例 —— to_async_url 用 str(url) 把口令打码成 ***，换到 PostgreSQL 当场认证失败，而报错指向凭据不指向代码，且旧用例里的 .replace("***", "p") 把打码当成了正确行为。现在 test_the_password_survives_translation 对两个出口各钉一条带口令的断言。同类函数以后都要有带口令用例；细节见 development/platform-foundation/012-known-tech-debt.md
    due: 2026-10-15
    status: mitigated
  - risk: builder.py 有 49 个 star-import lint 报错，且无测试覆盖
    impact: 该文件的名字解析不可静态验证，改动风险高
    owner: farfarfun
    action: 独立一次带测试的清理，不混在功能改动里。2026-10-17 补 CI 时把这 49 条改成了 pyproject 里的 per-file-ignores 显式豁免（而不是不跑 ruff），其余 104 个文件因此被 CI 覆盖；豁免那一节带注释说明来由，清理完删掉它 CI 就自动接管，即验收标准。同日核实「无测试覆盖」属实：tests/test_download_base.py 里的 _ReportBuilder 是假类，真正的 SourceReportBuilder（167 行，在 context.py:40 的生产路径上）一行都没跑过
    due: 2026-11-15
    status: open

  - risk: funread 与 funread-api 两个仓库没有任何 CI
    impact: 946 个测试只在本地跑；funbuild build 从本机直接推 PyPI，坏版本一路发到索引上都没有关卡
    owner: farfarfun
    action: 2026-10-17 两个仓库各加了 .github/workflows/ci.yml（ruff + ruff format --check + pytest；funread 跑 3.11/3.12，3.11 是 requires-python 的下限，funread-api 钉 3.12 且装 PyPI 版 funread 以验证声明的依赖组合）。**残留的缺口是发版本身仍不经过 CI** —— 这条流水线只能让问题在 push 后几分钟可见，拦不住已经推上 PyPI 的版本。要真正关门得让发版前先跑测试，或把发布改成 tag 触发，那是独立一件事
    due: 2026-11-15
    status: mitigated

  - risk: 订阅功能对标 Folo 缺 AI 摘要与翻译，这个差距会被反复问起
    impact: 没有留档的话，每次问起都要重新调研一遍代码才能回答「做到哪了」，而且容易被当成「忘了做」而不是「决定不做」
    owner: farfarfun
    action: 2026-10-18 明确这一期不排 AI。三个依赖必须一起定，单独定任何一个都会返工：推理放哪（云端质量好但正文要发给第三方且按量计费，一个活跃订阅一周几千篇；本地模型不出局域网但要求机器跑得动且质量明显不如）、密钥与开关怎么进配置（按 M9 的规矩走 resolve_setting，默认关闭）、摘要落哪张表（它是「订阅不缓存正文」这条决定的第一个例外）。真做的时候第一刀是可插拔 provider 接口，不先绑死一家。社交与代币那部分是 Folo 的商业模式不是阅读功能，单人自托管没有社交图谱，一并不做。完整理由见 product/rss-subscription/004-folo-gap-and-roadmap.md
    due: 2026-12-31
    status: accepted
  - risk: Android APK 的签名密钥是明文提交在 funread-web 仓库里的
    impact: 任何人都能用同一把密钥签出能覆盖升级官方包的 APK
    owner: farfarfun
    action: 有意为之，不是疏忽。funread 自托管、APK 走 Release 侧载、不上应用商店，这把密钥只用来保证「同一个 app 能覆盖升级」，不承担「证明这个包来自官方」——后者在侧载分发里本来就不成立。换成 repo secret 的代价是 fork 出去的人得先配 secret 才能出可升级的包。**代偿**：README 与 .github/workflows/keystore.yml 都写明了「不要从不信任的来源安装 funread 的 APK」。真要上应用商店时换成私有密钥并删掉 keystore.yml。另一面的风险是不签固定密钥：CI 每跑一次 debug.keystore 重新生成，用户装了上一版再装下一版直接 INSTALL_FAILED_UPDATE_INCOMPATIBLE，只能卸载，而卸载会带走设备 token 和本机离线缓存
    due: 2026-10-17
    status: accepted
