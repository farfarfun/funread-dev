risks:
  - risk: 本机 funsecret 指向生产 PostgreSQL，本地运行可能误写生产库
    impact: 生产数据被测试数据污染，且无回滚手段
    owner: farfarfun
    action: 把库地址写进 ~/.farfarfun/funread/config.toml 的 [database] url（机器级，一次管所有终端与子进程），或在脚本里 config.set_overrides(database_url=...)；两个应用的 tests/conftest.py 都有 autouse fixture 用进程内 override 强制隔离，funread-api 那份还把整个 funsecret 层打成 None。注意环境变量已不再被读取（M9），旧的 export 办法现在无效
    due: 2026-10-16
    status: mitigated
  - risk: 任务入口「必须走 resolve_database_url()」这条约束只有注释守着，没有测试
    impact: 并行开发合并时容易被当成风格差异丢掉，一丢就是本地跑一次写进生产库
    owner: farfarfun
    action: 已收口 —— apps/funread/tests/test_task_database_resolution.py 对 check/merge/sync 三个入口各一条，断言进程内 override 的地址必须出现在它建的 store 上；谁改回直读 funsecret 就立刻红。覆盖层同时从环境变量换成了 override（M9），比 export 更难误触
    due: 2026-10-16
    status: mitigated
