risks:
  - risk: 本机 funsecret 指向生产 MySQL，本地运行可能误写生产库
    impact: 生产数据被测试数据污染，且无回滚手段
    owner: farfarfun
    action: 运行任何代码前 export FUNREAD_DATABASE_URL 覆盖；两个应用的 tests/conftest.py 都有 autouse fixture 强制隔离，已验证不带环境变量也安全
    due: 2026-10-16
    status: mitigated
  - risk: 任务入口「必须走 resolve_database_url()」这条约束只有注释守着，没有测试
    impact: 并行开发合并时容易被当成风格差异丢掉，一丢就是本地跑一次写进生产库
    owner: farfarfun
    action: 给 check/merge/sync 三个任务入口各加一条测试，断言它们尊重 FUNREAD_DATABASE_URL
    due: 2026-10-16
    status: open
  - risk: 真机走查未执行
    impact: 安全区、100dvh、虚拟滚动帧率、飞行模式离线这几类问题只能实机暴露，当前是交付完整性上最大的空缺
    owner: farfarfun
    action: 见里程碑 M5
    due: 2026-10-16
    status: open
  - risk: 索引上的 funread 1.1.103 没有 reader/parse extra，funread-api 装不出能用的 CLI
    impact: setup.sh install-dev/install-prod api 装完 CLI 在 import 处就崩
    owner: farfarfun
    action: 见里程碑 M6 —— 从仓库根跑 funbuild build 让两者共享版本号一起发布
    due: 2026-10-17
    status: open
  - risk: Legado 订阅源纯 Python 可解析率仅 10.6%（1344 个归档中 142 个）
    impact: 订阅源目录内容过薄，产品可用性不足
    owner: farfarfun
    action: 已同时支持用户自填标准 feed URL（RSS 2.0 / Atom / RDF），那条路径 100% 可用，不受归档质量制约
    due: 2026-10-26
    status: mitigated
  - risk: 书源语料大面积失效，status==2 只代表首页可 GET
    impact: 聚合搜索命中率低，用户搜不到书
    owner: farfarfun
    action: 选源排序已改为「实跑成功过的优先」，status 只当弱加分；搜索响应带源统计让界面能解释失败。彻底解决要接 quickjs（覆盖率 63%→95%）
    due: 2026-10-31
    status: open
  - risk: session cookie 是 secure=False，改成账号体系后仍不能暴露到公网
    impact: 公网部署会被中间人直接窃取 session，且现在窃取的是具名账号而不只是只读口令
    owner: farfarfun
    action: 文档明确限定局域网使用（product/reader-client/003-scope-and-constraints.md）；HTTPS、secure cookie 与登录速率限制作为后续独立事项
    due: 2026-10-30
    status: accepted
  - risk: 注册端点一旦可达，任何能连到局域网的人都能开账号
    impact: 未授权账号占用服务端抓取与缓存资源
    owner: farfarfun
    action: FUNREAD_REGISTER_CODE 未设置时 POST /auth/register 直接 403；设置后用 compare_digest 校验邀请码。已配测试
    due: 2026-10-15
    status: mitigated
  - risk: POST /rss/subscriptions 会让服务端拉调用方给的任意 URL（SSRF）
    impact: 可被用来探测内网服务
    owner: farfarfun
    action: 整组 /rss 挂 require_user，未登录不可达且不随 FUNREAD_READER_PUBLIC 放开；只认 http/https，响应设 8MB 上限。故意不屏蔽内网地址——局域网自托管里订阅同网段服务是正当需求，前提是整个服务不上公网
    due: 2026-10-30
    status: accepted
  - risk: 订阅文章正文经 v-html 插入，源站 HTML 可能带脚本
    impact: 任意源站的 XSS 进入我们的同源上下文
    owner: farfarfun
    action: RssArticleView 的 sanitize() 用 template.content 建游离片段再按标签与属性白名单过滤；href 与 src 只放 http 与 https，data URI 一并拦掉（data:text/html 可以执行脚本）
    due: 2026-10-30
    status: mitigated
  - risk: apps/funread-dat 未登记进 manifest，结构 checker 停在 revise
    impact: 治理检查不是 allow，CI 若以 allow 为门禁会卡住
    owner: farfarfun
    action: 先决定 funread-dat 的归属（做成真实 src-layout 包，或从 apps/ 移出去），再消除偏差；当前取舍已在 project-governance/001-overview.md 留档
    due: 2026-10-31
    status: accepted
  - risk: builder.py 有 49 个 star-import lint 报错，且无测试覆盖
    impact: 该文件的名字解析不可静态验证，改动风险高
    owner: farfarfun
    action: 独立一次带测试的清理，不混在功能改动里
    due: 2026-11-15
